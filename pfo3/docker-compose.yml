services:
  # ==========================================
  # 1. BASE DE DATOS POSTGRESQL (RF-09)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: pfo3_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: distributed_tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d distributed_tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. BROKER RABBITMQ (RF-08)
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pfo3_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 5

  # ==========================================
  # 3. ALMACENAMIENTO DE OBJETOS S3 / MINIO (RF-09)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: pfo3_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # ==========================================
  # 4. INSTANCIAS DE SERVIDOR TCP (RF-01, RF-04, RF-06)
  # ==========================================
  servidor_a:
    build: .
    container_name: pfo3_servidor_a
    restart: unless-stopped
    command: python -m server.tcp_server --port 5001 --server-id server-node-a
    environment:
      TCP_HOST: 0.0.0.0
      TCP_PORT: 5001
      SERVER_ID: server-node-a
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: postgrespassword
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5001:5001"

  servidor_b:
    build: .
    container_name: pfo3_servidor_b
    restart: unless-stopped
    command: python -m server.tcp_server --port 5002 --server-id server-node-b
    environment:
      TCP_HOST: 0.0.0.0
      TCP_PORT: 5002
      SERVER_ID: server-node-b
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: postgrespassword
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5002:5002"

  # ==========================================
  # 5. BALANCEADOR DE CARGA TCP NGINX (RF-07)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: pfo3_nginx_lb
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - servidor_a
      - servidor_b

  # ==========================================
  # 6. WORKERS CONCURRENTES DISTRIBUIDOS (RF-05, RF-06)
  # ==========================================
  worker_1:
    build: .
    container_name: pfo3_worker_1
    restart: unless-stopped
    command: python -m workers.worker --worker-id worker-01 --threads 4
    environment:
      WORKER_ID: worker-01
      WORKER_THREADS: 4
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: postgrespassword
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker_2:
    build: .
    container_name: pfo3_worker_2
    restart: unless-stopped
    command: python -m workers.worker --worker-id worker-02 --threads 4
    environment:
      WORKER_ID: worker-02
      WORKER_THREADS: 4
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: postgrespassword
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  rmqdata:
  miniodata:
