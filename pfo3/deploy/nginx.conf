user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# Configuración de balanceo TCP mediante el módulo stream (RF-07)
stream {
    upstream backend_servers {
        # Algoritmo de balanceo Round-Robin hacia las instancias de servidor Python
        server servidor_a:5001 max_fails=3 fail_timeout=10s;
        server servidor_b:5002 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 5000;
        proxy_pass backend_servers;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }
}
